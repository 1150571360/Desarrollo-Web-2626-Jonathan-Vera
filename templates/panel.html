{% extends "base.html" %}
{% block title %}Tecno Plus - Panel{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <h2 class="section-title mb-4">Panel del sistema</h2>
    <p class="text-muted mb-4">Selecciona un módulo para administrar la información de Tecno Plus.</p>
    <div class="row g-4">
      <div class="col-md-3 col-sm-6">
        <a href="{{ url_for('productos') }}" class="text-decoration-none">
          <div class="card card-tecno h-100 text-center py-4">
            <i class="bi bi-box-seam-fill text-accent" style="font-size: 2.5rem;"></i>
            <h5 class="mt-3">Productos</h5>
          </div>
        </a>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="{{ url_for('clientes') }}" class="text-decoration-none">
          <div class="card card-tecno h-100 text-center py-4">
            <i class="bi bi-people-fill text-accent" style="font-size: 2.5rem;"></i>
            <h5 class="mt-3">Clientes</h5>
          </div>
        </a>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="{{ url_for('proveedores') }}" class="text-decoration-none">
          <div class="card card-tecno h-100 text-center py-4">
            <i class="bi bi-truck text-accent" style="font-size: 2.5rem;"></i>
            <h5 class="mt-3">Proveedores</h5>
          </div>
        </a>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="{{ url_for('facturacion') }}" class="text-decoration-none">
          <div class="card card-tecno h-100 text-center py-4">
            <i class="bi bi-receipt text-accent" style="font-size: 2.5rem;"></i>
            <h5 class="mt-3">Facturación</h5>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
