{% extends "base.html" %}
{% block title %}Tecno Plus - Panel{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <h2 class="section-title mb-4">Panel del Sistema</h2>
    <div class="row g-4">
      <div class="col-md-3 col-6">
        <a href="{{ url_for('productos') }}" class="card card-tecno p-3 text-center text-decoration-none h-100">
          <div class="fs-1 mb-2">💻</div>
          <h6 class="mb-0">Productos</h6>
        </a>
      </div>
      <div class="col-md-3 col-6">
        <a href="{{ url_for('clientes') }}" class="card card-tecno p-3 text-center text-decoration-none h-100">
          <div class="fs-1 mb-2">🧑‍💼</div>
          <h6 class="mb-0">Clientes</h6>
        </a>
      </div>
      <div class="col-md-3 col-6">
        <a href="{{ url_for('proveedores') }}" class="card card-tecno p-3 text-center text-decoration-none h-100">
          <div class="fs-1 mb-2">🚚</div>
          <h6 class="mb-0">Proveedores</h6>
        </a>
      </div>
      <div class="col-md-3 col-6">
        <a href="{{ url_for('facturacion') }}" class="card card-tecno p-3 text-center text-decoration-none h-100">
          <div class="fs-1 mb-2">🧾</div>
          <h6 class="mb-0">Facturación</h6>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
